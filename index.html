<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Trading Dashboard</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CURRENCY_SYMBOLS = {
            USD: '$', GBP: '£', EUR: '€', JPY: '¥',
            CHF: 'CHF ', CAD: 'C$', AUD: 'A$', HKD: 'HK$', SEK: 'kr ', NOK: 'kr ',
        };
        const curSym = (code) => CURRENCY_SYMBOLS[code] || (code ? `${code} ` : '$');
        const money = (value, code, digits = 2) =>
            `${curSym(code)}${Number(value || 0).toFixed(digits)}`;
        const moneyLocale = (value, code) =>
            `${curSym(code)}${Number(value || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

        // Every /api/* call carries a shared secret. Kept at module scope, not in
        // component state, so the ~20 call sites below need no plumbing and no
        // effect ever closes over a stale token.
        let AUTH_TOKEN = '';
        try { AUTH_TOKEN = localStorage.getItem('dashboardToken') || ''; } catch (e) { /* private mode */ }

        let onUnauthorized = () => {};

        // A list endpoint that errors returns {"detail": ...}, not []. Feeding that to
        // state makes .map() throw during render, which unmounts the whole dashboard.
        const asArray = (v) => Array.isArray(v) ? v : [];

        // Risk lookback windows. Every statistic on the Risk tab is computed over the
        // selected one, trailing from today — not over "whatever history accumulated".
        // The Risk tab was three distinct jobs in one long scroll.
        const RESEARCH_VIEWS = [
            { key: 'rolling',  label: 'Rolling stats',
              blurb: 'How sigma, beta and correlation drifted, rather than one number for the whole window' },
            { key: 'pair',     label: 'Pair & spread',
              blurb: 'One name priced in another, with a z-score against its own trailing behaviour' },
            { key: 'backtest', label: 'Backtest',
              blurb: 'Equal-weight buy-and-hold over the stored bars, against a benchmark' },
        ];
        const RESEARCH_WINDOWS = [20, 60, 120, 252];
        const RESEARCH_RANGES = [
            { key: '6m', label: '6M' }, { key: '1y', label: '1Y' },
            { key: '2y', label: '2Y' }, { key: '3y', label: '3Y' },
        ];
        const BT_MAX = 12;

        const RISK_VIEWS = [
            { key: 'scorecard',   label: 'Scorecard',
              blurb: 'Four pass/fail gates per symbol, plus the risk stats behind them' },
            { key: 'correlation', label: 'Correlation',
              blurb: 'Pairwise correlation across the watchlist, or a set you drag together' },
            { key: 'drawdown',    label: 'Drawdown & capture',
              blurb: 'Distance from each peak, and how much of the benchmark each name takes up and down' },
        ];

        const RISK_WINDOWS = [
            { key: '1y', label: '1Y', full: '1 year' },
            { key: '2y', label: '2Y', full: '2 years' },
            { key: '3y', label: '3Y', full: '3 years' },
        ];

        // Order-history windows. Rolling rather than calendar ("7 days" is today
        // plus the previous six, not Monday-to-now) because a trader asking for a
        // week means the last week's trading, not whatever this week has held so far.
        const HISTORY_RANGES = [
            { key: 'today', label: 'Today' },
            { key: '7d',    label: '7 days' },
            { key: '30d',   label: '30 days' },
            { key: 'ytd',   label: 'YTD' },
            { key: 'all',   label: 'All' },
        ];

        // Boundaries are computed in the VIEWER's timezone and sent as UTC instants:
        // "today" has to mean the local trading day, not 00:00 UTC, which for a UK
        // user is an hour into the previous evening.
        const historyRangeStart = (key) => {
            const now = new Date();
            const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            if (key === 'today') return midnight;
            if (key === '7d')  { const d = new Date(midnight); d.setDate(d.getDate() - 6);  return d; }
            if (key === '30d') { const d = new Date(midnight); d.setDate(d.getDate() - 29); return d; }
            if (key === 'ytd') return new Date(now.getFullYear(), 0, 1);
            return null;  // 'all'
        };

        const api = async (path, options = {}) => {
            const res = await fetch(path, {
                ...options,
                headers: { ...(options.headers || {}), 'X-Dashboard-Token': AUTH_TOKEN },
            });
            // A 401 means the token is wrong or the server restarted with a new
            // generated one. Surface it as a prompt rather than letting every
            // poller fail silently and leave the UI looking merely disconnected.
            if (res.status === 401) onUnauthorized();
            return res;
        };

        // Without this, any uncaught render error unmounts the entire tree and leaves a
        // blank page with the cause only in the console — on a screen showing positions.
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { error: null, stack: null }; }
            static getDerivedStateFromError(error) { return { error }; }
            componentDidCatch(error, info) {
                this.setState({ stack: info && info.componentStack });
                console.error('Dashboard render error:', error, info);
            }
            render() {
                if (!this.state.error) return this.props.children;
                return (
                    <div className="max-w-3xl mx-auto p-6">
                        <div className="bg-red-950/20 border border-red-900/50 rounded-2xl p-6 space-y-4">
                            <h1 className="text-xl font-bold text-red-300">The dashboard hit a rendering error</h1>
                            <p className="text-sm text-gray-400">
                                Your orders and positions are unaffected — they live at IBKR, not in this page.
                            </p>
                            <pre className="text-xs font-mono text-red-300 bg-gray-900/60 p-3 rounded-lg overflow-x-auto whitespace-pre-wrap">
{String(this.state.error && (this.state.error.stack || this.state.error.message || this.state.error))}
                            </pre>
                            {this.state.stack && (
                                <pre className="text-[10px] font-mono text-gray-500 bg-gray-900/40 p-3 rounded-lg overflow-x-auto max-h-48">
{this.state.stack}
                                </pre>
                            )}
                            <button onClick={() => window.location.reload()}
                                    className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium">
                                Reload
                            </button>
                        </div>
                    </div>
                );
            }
        }

        // --- PRICE HISTORY CHART -------------------------------------------------
        const CHART_RANGES = [
            { key: '1h', label: '1H' },
            { key: '1d', label: '1D' },
            { key: '1m', label: '1M' },
            { key: '1y', label: '1Y' },
        ];

        // One hue family, two roles: the price line is the subject, volume is context
        // and sits a step darker so it recedes without turning gray. Both clear 3:1 on
        // the gray-900 surface; the grid is chrome, deliberately below that.
        const C_PRICE = '#3b82f6';
        const C_VOLUME = '#2563eb';
        const C_GRID = '#1f2937';
        const C_AXIS = '#9ca3af';

        // viewBox units. The height budget includes the x-axis band, so the card never
        // grows a nested scrollbar to reveal its own labels.
        const VB = { w: 760, padL: 52, padR: 14, padT: 10, priceH: 190, gap: 24, volH: 56, axisH: 24 };
        VB.h = VB.padT + VB.priceH + VB.gap + VB.volH + VB.axisH;
        VB.volBase = VB.padT + VB.priceH + VB.gap + VB.volH;

        const compactNum = (n) => {
            const a = Math.abs(n);
            if (a >= 1e9) return (n / 1e9).toFixed(1) + 'B';
            if (a >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (a >= 1e3) return (n / 1e3).toFixed(0) + 'K';
            return String(Math.round(n));
        };

        // Intraday ranges want a clock, daily ranges want a date.
        const axisLabel = (iso, range) => {
            const d = new Date(iso);
            if (isNaN(d)) return '';
            return range === '1h' || range === '1d'
                ? d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })
                : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        };
        const stampLabel = (iso, range) => {
            const d = new Date(iso);
            if (isNaN(d)) return iso;
            return range === '1h' || range === '1d'
                ? d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
                : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        };

        // Hover/focus explainer. Rendered position:fixed because the scorecard sits
        // in an overflow-x-auto container, which would clip an absolutely positioned
        // child at the table edge.
        function HelpHeader({ label, help }) {
            const [box, setBox] = useState(null);
            const open = (e) => {
                const r = e.currentTarget.getBoundingClientRect();
                const w = 340;
                // Clamp so the card never runs off either edge of the viewport.
                const x = Math.min(Math.max(r.left + r.width / 2, w / 2 + 8),
                                   window.innerWidth - w / 2 - 8);
                setBox({ x, y: r.bottom + 8, w });
            };
            const close = () => setBox(null);
            return (
                <span className="relative inline-block">
                    <span
                        tabIndex={0}
                        onMouseEnter={open}
                        onMouseLeave={close}
                        onFocus={open}
                        onBlur={close}
                        className="cursor-help border-b border-dotted border-gray-600 outline-none focus:border-gray-300"
                    >
                        {label}
                    </span>
                    {box && (
                        <span
                            role="tooltip"
                            className="fixed z-50 block text-left bg-gray-950 border border-gray-700 rounded-xl shadow-2xl p-3 space-y-2 normal-case tracking-normal"
                            style={{ left: box.x, top: box.y, width: box.w, transform: 'translateX(-50%)' }}
                        >
                            <span className="block text-xs font-semibold text-white">{help.what}</span>
                            <span className="block text-[11px] font-mono text-blue-300 whitespace-pre-line leading-relaxed">
                                {help.formula}
                            </span>
                            <span className="block text-[11px] font-mono text-gray-300">{help.gate}</span>
                            <span className="block text-[11px] text-gray-500 leading-relaxed">{help.note}</span>
                        </span>
                    )}
                </span>
            );
        }

        // Eight categorical slots, assigned in this fixed order and never cycled.
        // Ordered so no adjacent pair collides under colour-blind simulation:
        // orange next to green failed that check (CVD ΔE 6.8) and was separated.
        const SERIES_COLORS = ['#3b82f6', '#f97316', '#06b6d4', '#ec4899',
                               '#22c55e', '#a78bfa', '#eab308', '#ef4444'];
        const MAX_COMPARE = SERIES_COLORS.length;

        const COMPARE_RANGES = [
            { key: '1d', label: '1D' }, { key: '1w', label: '1W' },
            { key: '1m', label: '1M' }, { key: '6m', label: '6M' },
            { key: '1y', label: '1Y' }, { key: '3y', label: '3Y' },
        ];

        // Geometry in viewBox units; height includes the x-axis band so the card
        // never grows a nested scrollbar to show its own labels.
        const CVB = { w: 900, padL: 46, padR: 58, padT: 14, plotH: 300, axisH: 26 };
        CVB.h = CVB.padT + CVB.plotH + CVB.axisH;

        function CompareChart({ data, range, loading, onDropSymbol, onRemove }) {
            const [hover, setHover] = useState(null);
            const [dragOver, setDragOver] = useState(false);
            // Index range currently shown. null = everything.
            const [view, setView] = useState(null);
            // In-progress drag selection, in slot indices.
            const [sel, setSel] = useState(null);
            const svgRef = useRef(null);

            const allSeries = asArray(data && data.series);
            const allTimes = asArray(data && data.times);

            // A new payload invalidates any zoom: the indices no longer line up.
            useEffect(() => { setView(null); setSel(null); setHover(null); },
                      [range, allTimes.length, allSeries.length]);
            // And a zoom re-bases the index space, so a hover from the old window
            // would read past the end of the new one.
            useEffect(() => { setHover(null); }, [view]);

            const lo = view ? view.lo : 0;
            const hi = view ? view.hi : Math.max(0, allTimes.length - 1);
            const times = allTimes.slice(lo, hi + 1);
            const n = times.length;

            // Re-index to 100 at the START OF THE VISIBLE WINDOW. This is what makes
            // a zoom useful: three names up ~41% over a year are one thick line, but
            // rebased to a zoomed-in fortnight their spread is the whole chart.
            const series = React.useMemo(() => allSeries.map(s => {
                const slice = s.points.slice(lo, hi + 1);
                const base = slice[0];
                return {
                    symbol: s.symbol,
                    points: base ? slice.map(v => v / base * 100) : slice,
                };
            }), [allSeries, lo, hi]);

            const zoomed = !!view;

            const geo = React.useMemo(() => {
                if (!n || !series.length) return null;
                const all = series.flatMap(s => s.points);
                let top = Math.max(...all), bot = Math.min(...all);
                if (!(top > bot)) { top += 1; bot -= 1; }
                const pad = (top - bot) * 0.08;
                top += pad; bot -= pad;
                const plotW = CVB.w - CVB.padL - CVB.padR;
                const x = i => CVB.padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
                const y = v => CVB.padT + CVB.plotH * (1 - (v - bot) / (top - bot));
                const every = Math.max(1, Math.ceil(n / 6));
                const ticks = [];
                for (let k = 0; k <= 4; k++) ticks.push(bot + (top - bot) * (k / 4));
                return {
                    x, y, top, bot, plotW,
                    ticks,
                    // Drop any regular tick too close to the forced last one. A date
                    // label is ~11 monospace chars (~70 units) and the last is
                    // right-anchored, so they need ~130 units of clearance between
                    // centres — at 70 they still overprinted.
                    xTicks: times.map((_, i) => i)
                        .filter(i => i % every === 0 || i === n - 1)
                        .filter(i => i === n - 1
                            || (n - 1 - i) / Math.max(1, n - 1) * plotW > 130),
                    paths: series.map(s => s.points
                        .map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')),
                };
            }, [series, times, n]);

            // Pointer x -> slot index within the visible window.
            const slotAt = (clientX) => {
                const el = svgRef.current;
                if (!el || n < 2) return 0;
                const r = el.getBoundingClientRect();
                const vx = ((clientX - r.left) / r.width) * CVB.w;
                const frac = (vx - CVB.padL) / (CVB.w - CVB.padL - CVB.padR);
                return Math.max(0, Math.min(n - 1, Math.round(frac * (n - 1))));
            };

            const onDown = (e) => {
                if (n < 3) return;
                setSel({ a: slotAt(e.clientX), b: slotAt(e.clientX) });
            };
            const onMove = (e) => {
                const i = slotAt(e.clientX);
                setHover(i);
                if (sel) setSel(s => ({ ...s, b: i }));
            };
            const onUp = () => {
                if (!sel) return;
                const a = Math.min(sel.a, sel.b), b = Math.max(sel.a, sel.b);
                // A click is a drag of zero width; only treat a real sweep as a zoom,
                // or every attempt to read a value would collapse the chart.
                if (b - a >= 2) setView({ lo: lo + a, hi: lo + b });
                setSel(null);
            };

            const stamp = (iso) => {
                const d = new Date(iso);
                if (isNaN(d)) return iso;
                return ['1d', '1w'].includes(range)
                    ? d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
                    : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
            };

            const dropProps = {
                onDragOver: (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; setDragOver(true); },
                onDragLeave: () => setDragOver(false),
                onDrop: (e) => {
                    e.preventDefault(); setDragOver(false);
                    onDropSymbol(e.dataTransfer.getData('text/plain'));
                },
            };

            const selBox = sel && Math.abs(sel.b - sel.a) >= 1 && geo
                ? { x1: geo.x(Math.min(sel.a, sel.b)), x2: geo.x(Math.max(sel.a, sel.b)) } : null;

            return (
                <div {...dropProps}
                     className={`rounded-xl border transition-colors ${
                         dragOver ? 'border-blue-500 bg-blue-500/10' : 'border-gray-800 bg-gray-900/20'}`}>
                    {!series.length ? (
                        <div className="py-20 text-center text-sm text-gray-500 italic px-6">
                            {loading ? 'Loading…'
                                : (data && data.message) ||
                                  'Add a ticker above, or drag one in from the watchlist, to compare.'}
                        </div>
                    ) : (
                        <div className={`transition-opacity ${loading ? 'opacity-50' : ''}`}>
                            <div className="flex items-center justify-between px-4 pt-2.5 text-[11px]">
                                <span className="font-mono text-gray-500">
                                    {zoomed
                                        ? <span className="text-blue-400">
                                              zoomed · {stamp(times[0])} → {stamp(times[n - 1])} · rebased to this window
                                          </span>
                                        : 'drag across the chart to zoom'}
                                </span>
                                {zoomed && (
                                    <button onClick={() => { setView(null); setHover(null); }}
                                            className="text-[11px] border border-gray-700 text-gray-300 hover:text-white hover:border-gray-500 px-2 py-0.5 rounded transition-colors">
                                        Reset zoom
                                    </button>
                                )}
                            </div>
                            <svg
                                ref={svgRef}
                                viewBox={`0 0 ${CVB.w} ${CVB.h}`}
                                className={`w-full select-none outline-none ${sel ? 'cursor-col-resize' : 'cursor-crosshair'}`}
                                role="img"
                                aria-label={`${series.map(s => s.symbol).join(', ')} rebased to 100${zoomed ? ' over the zoomed window' : ''}`}
                                tabIndex={0}
                                onKeyDown={(e) => {
                                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                                        e.preventDefault();
                                        const step = e.key === 'ArrowLeft' ? -1 : 1;
                                        setHover(h => Math.max(0, Math.min(n - 1, (h == null ? n - 1 : h) + step)));
                                    } else if (e.key === 'Escape') { setView(null); setHover(null); }
                                }}
                                onMouseDown={onDown}
                                onMouseMove={onMove}
                                onMouseUp={onUp}
                                onMouseLeave={() => { setHover(null); setSel(null); }}
                                onDoubleClick={() => setView(null)}
                                onTouchStart={(e) => e.touches[0] && setHover(slotAt(e.touches[0].clientX))}
                                onTouchMove={(e) => e.touches[0] && setHover(slotAt(e.touches[0].clientX))}
                            >
                                {geo.ticks.map((v, k) => (
                                    <g key={k}>
                                        <line x1={CVB.padL} x2={CVB.w - CVB.padR} y1={geo.y(v)} y2={geo.y(v)}
                                              stroke="#1f2937" strokeWidth="1" />
                                        <text x={CVB.padL - 8} y={geo.y(v) + 3} textAnchor="end"
                                              fill="#9ca3af" fontSize="10" fontFamily="ui-monospace, monospace">
                                            {/* Two decimals once the range is tight, or every
                                                gridline rounds to the same integer. */}
                                            {(geo.top - geo.bot) < 6 ? v.toFixed(2) : v.toFixed(0)}
                                        </text>
                                    </g>
                                ))}
                                {geo.bot < 100 && geo.top > 100 && (
                                    <line x1={CVB.padL} x2={CVB.w - CVB.padR} y1={geo.y(100)} y2={geo.y(100)}
                                          stroke="#4b5563" strokeWidth="1" />
                                )}

                                {geo.paths.map((d, i) => (
                                    <path key={series[i].symbol} d={d} fill="none"
                                          stroke={SERIES_COLORS[i % SERIES_COLORS.length]}
                                          strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
                                ))}

                                {series.map((s, i) => (
                                    <text key={s.symbol} x={CVB.w - CVB.padR + 6}
                                          y={geo.y(s.points[n - 1]) + 3}
                                          fill={SERIES_COLORS[i % SERIES_COLORS.length]}
                                          fontSize="10" fontWeight="700" fontFamily="ui-monospace, monospace">
                                        {s.symbol}
                                    </text>
                                ))}

                                {geo.xTicks.map(i => {
                                    const first = i === 0, last = i === n - 1;
                                    return (
                                        <text key={i}
                                              x={first ? CVB.padL : last ? CVB.w - CVB.padR : geo.x(i)}
                                              y={CVB.h - 8}
                                              textAnchor={first ? 'start' : last ? 'end' : 'middle'}
                                              fill="#9ca3af" fontSize="10" fontFamily="ui-monospace, monospace">
                                            {stamp(times[i]).replace(/, \d{4}$/, '')}
                                        </text>
                                    );
                                })}

                                {selBox && (
                                    <rect x={selBox.x1} y={CVB.padT} width={Math.max(1, selBox.x2 - selBox.x1)}
                                          height={CVB.plotH} fill="#3b82f6" opacity="0.15"
                                          stroke="#3b82f6" strokeWidth="1" />
                                )}

                                {hover != null && !sel && (
                                    <g>
                                        <line x1={geo.x(hover)} x2={geo.x(hover)}
                                              y1={CVB.padT} y2={CVB.padT + CVB.plotH}
                                              stroke="#9ca3af" strokeWidth="1" opacity="0.5" />
                                        {series.map((s, i) => (
                                            <circle key={s.symbol} cx={geo.x(hover)} cy={geo.y(s.points[hover])}
                                                    r="3.5" fill={SERIES_COLORS[i % SERIES_COLORS.length]}
                                                    stroke="#111827" strokeWidth="2" />
                                        ))}
                                    </g>
                                )}
                            </svg>

                            <div className="px-4 pb-3 pt-1 flex flex-wrap gap-x-4 gap-y-2 items-center">
                                {hover != null && (
                                    <span className="text-[11px] font-mono text-gray-500 w-full">
                                        {stamp(times[hover])}
                                    </span>
                                )}
                                {series.map((s, i) => {
                                    const at = hover != null && hover < s.points.length ? hover : s.points.length - 1;
                                    const v = s.points[at];
                                    const chg = (v == null ? 100 : v) - 100;
                                    return (
                                        <span key={s.symbol}
                                              className="inline-flex items-center gap-1.5 text-xs font-mono bg-gray-900/50 border border-gray-800 rounded-lg pl-2 pr-1 py-1">
                                            <span className="w-2.5 h-2.5 rounded-sm shrink-0"
                                                  style={{ background: SERIES_COLORS[i % SERIES_COLORS.length] }}></span>
                                            <span className="font-sans font-semibold text-gray-200">{s.symbol}</span>
                                            <span className={chg >= 0 ? 'text-green-400' : 'text-red-400'}>
                                                {chg >= 0 ? '+' : ''}{chg.toFixed(2)}%
                                            </span>
                                            {/* A real button, not a bare glyph: the old one was there
                                                but read as punctuation and went unnoticed. */}
                                            <button onClick={() => onRemove(s.symbol)}
                                                    title={`Remove ${s.symbol} from the chart`}
                                                    aria-label={`Remove ${s.symbol}`}
                                                    className="ml-0.5 w-5 h-5 rounded flex items-center justify-center text-gray-500 hover:text-white hover:bg-red-600/70 transition-colors leading-none">
                                                ×
                                            </button>
                                        </span>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        }


        // ------------------------------------------------------------------
        // Research charts
        // ------------------------------------------------------------------
        // Short panels, because three of them stack under one x-axis. Separate
        // panels rather than one chart with three y-scales: an annualised
        // percentage, an unitless beta and a bounded correlation share no scale,
        // and overlaying them would draw crossings that are not in the data.
        const RVB = { w: 900, padL: 52, padR: 58, padT: 22, plotH: 96, axisH: 24, gap: 12 };

        const isNum = v => typeof v === 'number' && isFinite(v);
        const dayLabel = (iso) => {
            const d = new Date(`${iso}T00:00:00`);
            return isNaN(d) ? iso : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        };

        // One panel of a small-multiple stack. `bands` draws filled ranges behind
        // the line (the pair chart's ±1σ/±2σ), `refs` draws flat reference lines.
        function MiniPanel({ days, series, bands, refs, color, label, unit, hover,
                             fmt, domain, axis, height }) {
            const n = days.length;
            const plotH = height || RVB.plotH;
            const geo = React.useMemo(() => {
                const vals = [].concat(
                    ...series.map(s => s.values.filter(isNum)),
                    ...(bands || []).flatMap(b => [b.lo.filter(isNum), b.hi.filter(isNum)]),
                    (domain || []).filter(isNum),
                );
                if (!n || !vals.length) return null;
                let top = Math.max(...vals), bot = Math.min(...vals);
                if (!(top > bot)) { top += 0.5; bot -= 0.5; }
                const pad = (top - bot) * 0.12;
                top += pad; bot -= pad;
                const plotW = RVB.w - RVB.padL - RVB.padR;
                const x = i => RVB.padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
                const y = v => RVB.padT + plotH * (1 - (v - bot) / (top - bot));
                const ticks = [bot, (bot + top) / 2, top];
                // A null in the middle of a series breaks the path rather than
                // bridging it: a straight line across a gap is a claim about days
                // that were never computed.
                const toPath = (values) => {
                    let d = '', pen = false;
                    values.forEach((v, i) => {
                        if (!isNum(v)) { pen = false; return; }
                        d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
                        pen = true;
                    });
                    return d.trim();
                };
                const toArea = (lo, hi) => {
                    const pts = [];
                    for (let i = 0; i < n; i++) if (isNum(lo[i]) && isNum(hi[i])) pts.push(i);
                    if (pts.length < 2) return '';
                    const up = pts.map((i, k) => `${k ? 'L' : 'M'}${x(i).toFixed(1)},${y(hi[i]).toFixed(1)}`).join(' ');
                    const dn = pts.slice().reverse().map(i => `L${x(i).toFixed(1)},${y(lo[i]).toFixed(1)}`).join(' ');
                    return `${up} ${dn} Z`;
                };
                return { x, y, top, bot, ticks, plotW, toPath, toArea };
            }, [days, series, bands, domain, n, plotH]);

            const h = RVB.padT + plotH + (axis ? RVB.axisH : RVB.gap);
            if (!geo) {
                return <div className="h-20 flex items-center justify-center text-xs text-gray-600 italic">
                    No {label} to plot.
                </div>;
            }
            const every = Math.max(1, Math.ceil(n / 6));
            const xTicks = days.map((_, i) => i)
                .filter(i => i % every === 0 || i === n - 1)
                .filter(i => i === n - 1 || (n - 1 - i) / Math.max(1, n - 1) * geo.plotW > 130);
            const f = fmt || (v => v.toFixed(2));

            return (
                <svg viewBox={`0 0 ${RVB.w} ${h}`} className="w-full select-none" role="img"
                     aria-label={`${label} over time`}>
                    {geo.ticks.map((v, k) => (
                        <g key={k}>
                            <line x1={RVB.padL} x2={RVB.w - RVB.padR} y1={geo.y(v)} y2={geo.y(v)}
                                  stroke="#1f2937" strokeWidth="1" />
                            <text x={RVB.padL - 8} y={geo.y(v) + 3} textAnchor="end"
                                  fill="#9ca3af" fontSize="10" fontFamily="ui-monospace, monospace">{f(v)}</text>
                        </g>
                    ))}
                    {(bands || []).map((b, k) => (
                        <path key={k} d={geo.toArea(b.lo, b.hi)} fill={b.fill} stroke="none" />
                    ))}
                    {(refs || []).filter(r => r.value > geo.bot && r.value < geo.top).map((r, k) => (
                        <g key={`r${k}`}>
                            <line x1={RVB.padL} x2={RVB.w - RVB.padR} y1={geo.y(r.value)} y2={geo.y(r.value)}
                                  stroke={r.color || '#4b5563'} strokeWidth="1"
                                  strokeDasharray={r.dash || '4 3'} />
                            {r.label && (
                                <text x={RVB.w - RVB.padR + 5} y={geo.y(r.value) + 3} fill={r.color || '#6b7280'}
                                      fontSize="9" fontFamily="ui-monospace, monospace">{r.label}</text>
                            )}
                        </g>
                    ))}
                    {series.map((s, i) => (
                        <path key={s.key || i} d={geo.toPath(s.values)} fill="none"
                              stroke={s.color || color} strokeWidth="2"
                              strokeDasharray={s.dash || undefined}
                              strokeLinejoin="round" strokeLinecap="round" />
                    ))}
                    {hover != null && hover < n && (
                        <g>
                            <line x1={geo.x(hover)} x2={geo.x(hover)} y1={RVB.padT} y2={RVB.padT + plotH}
                                  stroke="#9ca3af" strokeWidth="1" opacity="0.5" />
                            {series.filter(s => isNum(s.values[hover])).map((s, i) => (
                                <circle key={s.key || i} cx={geo.x(hover)} cy={geo.y(s.values[hover])}
                                        r="3.5" fill={s.color || color} stroke="#111827" strokeWidth="2" />
                            ))}
                        </g>
                    )}
                    {/* Above the plot, not inside it: at the top-left of the frame the
                        label sat on the first few sessions of the line. */}
                    <text x={RVB.padL - 44} y={RVB.padT - 8} fill="#d1d5db" fontSize="11" fontWeight="700">
                        {label}{unit ? <tspan fill="#6b7280" fontWeight="400"> {unit}</tspan> : null}
                    </text>
                    {axis && xTicks.map(i => {
                        const first = i === 0, last = i === n - 1;
                        return (
                            <text key={i} x={first ? RVB.padL : last ? RVB.w - RVB.padR : geo.x(i)}
                                  y={h - 7} textAnchor={first ? 'start' : last ? 'end' : 'middle'}
                                  fill="#9ca3af" fontSize="10" fontFamily="ui-monospace, monospace">
                                {dayLabel(days[i]).replace(/, \d{4}$/, '')}
                            </text>
                        );
                    })}
                </svg>
            );
        }

        // Shared hover across a stack of panels: one pointer position, read off
        // every panel at once, which is the point of a small-multiple stack.
        function PanelStack({ days, children, onHover }) {
            const ref = useRef(null);
            const n = days.length;
            const slotAt = (clientX) => {
                const el = ref.current;
                if (!el || n < 2) return 0;
                const r = el.getBoundingClientRect();
                const vx = ((clientX - r.left) / r.width) * RVB.w;
                const frac = (vx - RVB.padL) / (RVB.w - RVB.padL - RVB.padR);
                return Math.max(0, Math.min(n - 1, Math.round(frac * (n - 1))));
            };
            return (
                <div ref={ref} className="cursor-crosshair"
                     onMouseMove={e => onHover(slotAt(e.clientX))}
                     onMouseLeave={() => onHover(null)}
                     onTouchStart={e => e.touches[0] && onHover(slotAt(e.touches[0].clientX))}
                     onTouchMove={e => e.touches[0] && onHover(slotAt(e.touches[0].clientX))}>
                    {children}
                </div>
            );
        }


        function PriceChart({ symbol, range, onRange, data, loading, error, currency }) {
            const [hover, setHover] = useState(null);
            const [showTable, setShowTable] = useState(false);
            const svgRef = useRef(null);

            const bars = asArray(data && data.bars);
            const n = bars.length;

            // Hover index is held across a refetch, so it must never outlive the data.
            useEffect(() => { setHover(null); }, [symbol, range, n]);

            const geo = React.useMemo(() => {
                if (!n) return null;
                const plotW = VB.w - VB.padL - VB.padR;
                const slot = plotW / n;
                const highs = bars.map(b => b.h ?? b.c), lows = bars.map(b => b.l ?? b.c);
                let hi = Math.max(...highs), lo = Math.min(...lows);
                if (!(hi > lo)) { hi = hi + 1; lo = lo - 1; }   // a flat series still needs a band
                const pad = (hi - lo) * 0.08;
                hi += pad; lo -= pad;
                const vmax = Math.max(1, ...bars.map(b => b.v || 0));

                const x = (i) => VB.padL + (i + 0.5) * slot;
                const yP = (v) => VB.padT + VB.priceH * (1 - (v - lo) / (hi - lo));
                const yV = (v) => VB.volBase - VB.volH * ((v || 0) / vmax);

                // Ticks: 4 price gridlines, and ~6 x labels regardless of bar count.
                const priceTicks = [0, 1, 2, 3].map(k => lo + (hi - lo) * (k / 3));
                const every = Math.max(1, Math.ceil(n / 6));
                const xTicks = bars.map((b, i) => i).filter(i => i % every === 0 || i === n - 1);

                return { slot, hi, lo, vmax, x, yP, yV, priceTicks, xTicks,
                         line: bars.map((b, i) => `${i ? 'L' : 'M'}${x(i).toFixed(2)},${yP(b.c).toFixed(2)}`).join(' ') };
            }, [bars, n]);

            const pick = (clientX) => {
                const el = svgRef.current;
                if (!el || !geo) return;
                const r = el.getBoundingClientRect();
                const vx = ((clientX - r.left) / r.width) * VB.w;
                const i = Math.round((vx - VB.padL) / geo.slot - 0.5);
                setHover(Math.max(0, Math.min(n - 1, i)));
            };

            const onKey = (e) => {
                if (!n) return;
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    const step = e.key === 'ArrowLeft' ? -1 : 1;
                    setHover(h => Math.max(0, Math.min(n - 1, (h == null ? n - 1 : h) + step)));
                } else if (e.key === 'Escape') setHover(null);
            };

            const active = hover != null && bars[hover] ? bars[hover] : null;
            const last = n ? bars[n - 1] : null;
            const first = n ? bars[0] : null;
            const change = last && first && first.c ? ((last.c - first.c) / first.c) * 100 : null;
            const shown = active || last;

            return (
                <div className="bg-gray-800/20 backdrop-blur-md border border-gray-700/80 rounded-2xl p-5 shadow-lg space-y-4">
                    {/* Filter row above the plots: one control scoping both panels. */}
                    <div className="flex flex-wrap items-center justify-between gap-3">
                        <div className="flex items-baseline gap-3">
                            <h3 className="text-md font-bold text-gray-200 uppercase tracking-wider">
                                {symbol || '--'} <span className="text-gray-500 normal-case font-medium">price history</span>
                            </h3>
                            {change != null && (
                                <span className={`font-mono text-sm font-bold ${change >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                    {change >= 0 ? '+' : ''}{change.toFixed(2)}%
                                </span>
                            )}
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="flex items-center gap-1 bg-gray-900/50 border border-gray-800 rounded-lg p-1">
                                {CHART_RANGES.map(r => (
                                    <button
                                        key={r.key}
                                        onClick={() => onRange(r.key)}
                                        className={`px-3 py-1 rounded-md text-xs font-semibold transition-colors ${
                                            range === r.key ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-gray-200'
                                        }`}
                                    >{r.label}</button>
                                ))}
                            </div>
                            <button
                                onClick={() => setShowTable(v => !v)}
                                className="text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-3 py-2 rounded-lg font-medium transition-colors"
                                title="Every plotted value, as numbers"
                            >{showTable ? 'Chart' : 'Table'}</button>
                        </div>
                    </div>

                    {/* Readout. Follows the cursor when hovering, otherwise the latest bar. */}
                    {shown && (
                        <div className="flex flex-wrap gap-x-5 gap-y-1 text-xs font-mono text-gray-400">
                            <span className="text-gray-500">{stampLabel(shown.t, range)}</span>
                            <span>O <span className="text-gray-200">{money(shown.o, currency)}</span></span>
                            <span>H <span className="text-gray-200">{money(shown.h, currency)}</span></span>
                            <span>L <span className="text-gray-200">{money(shown.l, currency)}</span></span>
                            <span>C <span className="text-white font-bold">{money(shown.c, currency)}</span></span>
                            <span>Vol <span className="text-gray-200">{compactNum(shown.v || 0)}</span></span>
                        </div>
                    )}

                    {error && !n ? (
                        <div className="py-12 text-center text-sm text-gray-500 italic">{error}</div>
                    ) : !n ? (
                        <div className="py-12 text-center text-sm text-gray-500 italic">
                            {loading ? 'Loading history…' : 'No history for this range.'}
                        </div>
                    ) : showTable ? (
                        <div className="overflow-auto max-h-72 border border-gray-800 rounded-lg">
                            <table className="w-full text-left text-xs font-mono">
                                <thead className="sticky top-0 bg-gray-900">
                                    <tr className="text-gray-400 border-b border-gray-800">
                                        <th className="py-2 px-2 font-semibold">Time</th>
                                        <th className="py-2 px-2 text-right font-semibold">Open</th>
                                        <th className="py-2 px-2 text-right font-semibold">High</th>
                                        <th className="py-2 px-2 text-right font-semibold">Low</th>
                                        <th className="py-2 px-2 text-right font-semibold">Close</th>
                                        <th className="py-2 px-2 text-right font-semibold">Volume</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-800/60 text-gray-300">
                                    {[...bars].reverse().map((b, i) => (
                                        <tr key={i} className="hover:bg-gray-800/30">
                                            <td className="py-1.5 px-2 text-gray-500">{stampLabel(b.t, range)}</td>
                                            <td className="py-1.5 px-2 text-right">{money(b.o, currency)}</td>
                                            <td className="py-1.5 px-2 text-right">{money(b.h, currency)}</td>
                                            <td className="py-1.5 px-2 text-right">{money(b.l, currency)}</td>
                                            <td className="py-1.5 px-2 text-right text-white">{money(b.c, currency)}</td>
                                            <td className="py-1.5 px-2 text-right">{(b.v || 0).toLocaleString()}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    ) : (
                        // Previous render is held at reduced opacity during a refetch —
                        // no skeleton flash, no layout jump.
                        <div className={`transition-opacity ${loading ? 'opacity-50' : 'opacity-100'}`}>
                            <svg
                                ref={svgRef}
                                viewBox={`0 0 ${VB.w} ${VB.h}`}
                                className="w-full select-none outline-none"
                                style={{ height: 'auto' }}
                                role="img"
                                aria-label={`${symbol} price and volume, ${data && data.label ? data.label : range}`}
                                tabIndex={0}
                                onKeyDown={onKey}
                                onMouseMove={(e) => pick(e.clientX)}
                                onMouseLeave={() => setHover(null)}
                                onTouchStart={(e) => e.touches[0] && pick(e.touches[0].clientX)}
                                onTouchMove={(e) => e.touches[0] && pick(e.touches[0].clientX)}
                            >
                                {/* Price gridlines — solid hairlines, one shade off the surface. */}
                                {geo.priceTicks.map((v, k) => (
                                    <g key={k}>
                                        <line x1={VB.padL} x2={VB.w - VB.padR} y1={geo.yP(v)} y2={geo.yP(v)}
                                              stroke={C_GRID} strokeWidth="1" />
                                        <text x={VB.padL - 8} y={geo.yP(v) + 3} textAnchor="end"
                                              fill={C_AXIS} fontSize="10" fontFamily="ui-monospace, monospace">
                                            {Number(v).toFixed(2)}
                                        </text>
                                    </g>
                                ))}

                                {/* Area under the line: one series, so the fill is the same
                                    hue at low alpha rather than a second color. */}
                                <defs>
                                    <linearGradient id="priceFill" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor={C_PRICE} stopOpacity="0.22" />
                                        <stop offset="100%" stopColor={C_PRICE} stopOpacity="0" />
                                    </linearGradient>
                                </defs>
                                <path
                                    d={`${geo.line} L${geo.x(n - 1).toFixed(2)},${VB.padT + VB.priceH} L${geo.x(0).toFixed(2)},${VB.padT + VB.priceH} Z`}
                                    fill="url(#priceFill)"
                                />
                                <path d={geo.line} fill="none" stroke={C_PRICE} strokeWidth="2"
                                      strokeLinejoin="round" strokeLinecap="round" />

                                {/* Volume, its own panel and its own baseline. Separate panels
                                    rather than a second y-axis on the price plot. */}
                                {bars.map((b, i) => {
                                    // A 2px gap needs a slot wide enough to hold it; below that
                                    // the bars become a 1px histogram silhouette instead.
                                    const gap = geo.slot > 4 ? 2 : 0;
                                    const w = Math.max(1, geo.slot - gap);
                                    const y = geo.yV(b.v);
                                    const h = Math.max(b.v ? 1 : 0, VB.volBase - y);
                                    return (
                                        <rect key={i} x={geo.x(i) - w / 2} y={VB.volBase - h} width={w} height={h}
                                              fill={C_VOLUME} opacity={hover == null || hover === i ? 0.85 : 0.45}
                                              rx={w >= 4 ? 1.5 : 0} />
                                    );
                                })}
                                <line x1={VB.padL} x2={VB.w - VB.padR} y1={VB.volBase} y2={VB.volBase}
                                      stroke={C_GRID} strokeWidth="1" />
                                <text x={VB.padL - 8} y={VB.volBase - VB.volH + 8} textAnchor="end"
                                      fill={C_AXIS} fontSize="9" fontFamily="ui-monospace, monospace">
                                    {compactNum(geo.vmax)}
                                </text>
                                <text x={VB.padL - 8} y={VB.volBase + 3} textAnchor="end"
                                      fill={C_AXIS} fontSize="9" fontFamily="ui-monospace, monospace">vol</text>

                                {/* x labels, in the band the height budget reserved for them. */}
                                {geo.xTicks.map(i => {
                                    const first = i === 0, lastTick = i === n - 1;
                                    return (
                                        <text
                                            key={i}
                                            x={first ? VB.padL : lastTick ? VB.w - VB.padR : geo.x(i)}
                                            y={VB.h - 8}
                                            textAnchor={first ? 'start' : lastTick ? 'end' : 'middle'}
                                            fill={C_AXIS} fontSize="10" fontFamily="ui-monospace, monospace"
                                        >
                                            {axisLabel(bars[i].t, range)}
                                        </text>
                                    );
                                })}

                                {/* Endpoint is the one direct label — never a number per point. */}
                                {last && hover == null && (
                                    <g>
                                        <circle cx={geo.x(n - 1)} cy={geo.yP(last.c)} r="3.5"
                                                fill={C_PRICE} stroke="#111827" strokeWidth="2" />
                                        <text x={geo.x(n - 1) - 6} y={geo.yP(last.c) - 10}
                                              textAnchor="end" fill="#e5e7eb" fontSize="11" fontWeight="700"
                                              fontFamily="ui-monospace, monospace"
                                              stroke="#111827" strokeWidth="3" paintOrder="stroke">
                                            {Number(last.c).toFixed(2)}
                                        </text>
                                    </g>
                                )}

                                {/* Crosshair spans both panels, so one cursor reads both. */}
                                {active && (
                                    <g>
                                        <line x1={geo.x(hover)} x2={geo.x(hover)} y1={VB.padT} y2={VB.volBase}
                                              stroke={C_AXIS} strokeWidth="1" opacity="0.5" />
                                        <circle cx={geo.x(hover)} cy={geo.yP(active.c)} r="4.5"
                                                fill={C_PRICE} stroke="#111827" strokeWidth="2" />
                                    </g>
                                )}
                            </svg>
                        </div>
                    )}

                    <p className="text-[11px] text-gray-600">
                        {data && data.source === 'store'
                            ? `Daily bars from stored history${data.lastStoredDay ? `, through ${data.lastStoredDay}` : ''}${data.stale ? ' — refreshing in the background' : ''}`
                            : data && data.barSize ? `${data.barSize} bars from IBKR${data.cached ? ' (cached)' : ''}` : ''}
                        {n > 0 && <span className="text-gray-700"> · hover or use ←/→ to inspect a bar</span>}
                    </p>
                </div>
            );
        }

        function App() {
            const [prices, setPrices] = useState({});
            const [selectedTicker, setSelectedTicker] = useState('PL');

            // Price history for the selected watchlist name.
            const [chartRange, setChartRange] = useState('1d');
            const [chartData, setChartData] = useState(null);
            const [chartLoading, setChartLoading] = useState(false);
            const [chartError, setChartError] = useState('');
            const [newTicker, setNewTicker] = useState('');

            // Connection management states
            const [isConnected, setIsConnected] = useState(false);
            const [host, setHost] = useState('127.0.0.1');
            const [port, setPort] = useState(4002);
            const [clientId, setClientId] = useState(1);
            const [isConnecting, setIsConnecting] = useState(false);
            const [connectionError, setConnectionError] = useState('');
            const [showSettings, setShowSettings] = useState(false);

            // Why the price feed is (or isn't) delivering — see GET /api/feed/status.
            // Blank quotes are ambiguous on their own; this says which cause it is.
            const [feedStatus, setFeedStatus] = useState(null);

            // Risk analytics, keyed by symbol. Derived from stored daily bars, so it
            // changes once a day — polled slowly, and NOT gated on isConnected since
            // the numbers stay valid while the gateway is down.
            const [riskWindow, setRiskWindow] = useState('1y');
            // Remembered, so coming back to Risk returns you to the view you were using.
            // --- Comparison screener ---
            // Symbols live here (not in the chart) so drag, typing and removal all
            // write to one list, and it survives a reload.
            const [cmpSymbols, setCmpSymbols] = useState(() => {
                try {
                    const v = JSON.parse(localStorage.getItem('cmpSymbols') || '[]');
                    return Array.isArray(v) ? v.slice(0, MAX_COMPARE) : [];
                } catch (e) { return []; }
            });
            const [cmpRange, setCmpRange] = useState('1y');
            const [cmpInput, setCmpInput] = useState('');
            const [cmpData, setCmpData] = useState(null);
            const [cmpLoading, setCmpLoading] = useState(false);

            useEffect(() => {
                try { localStorage.setItem('cmpSymbols', JSON.stringify(cmpSymbols)); }
                catch (e) { /* private mode */ }
            }, [cmpSymbols]);

            const addCompare = (raw) => {
                const sym = String(raw || '').trim().toUpperCase();
                if (!sym) return;
                setCmpSymbols(prev => prev.includes(sym) || prev.length >= MAX_COMPARE
                    ? prev : [...prev, sym]);
