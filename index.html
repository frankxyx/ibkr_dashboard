                return () => { cancelled = true; if (interval) clearInterval(interval); };
            }, [selectedTicker, chartRange, hasToken]);

            // Swap a ticker for the same fund's line in the account currency.
            const swapToTwin = async (oldSym, twin) => {
                if (!confirm(`Replace ${oldSym} with ${twin.symbol}?\n\n`
                    + `Same fund (ISIN ${twin.isin || 'unknown'}), priced in ${twin.currency} `
                    + `on ${twin.exchange} instead of the current line.`)) return;
                try {
                    const add = await api(`/api/tickers/${twin.symbol}`, { method: 'POST' });
                    const r = await add.json();
                    if (r.status !== 'success' && r.status !== 'already tracking') {
                        alert(r.message || `Could not add ${twin.symbol}`);
                        return;
                    }
                    // Inherit the old ticker's group before removing it, so the
                    // replacement does not land in "Other".
                    const g = themeCfg.assign[oldSym];
                    if (g) await assignGroup(twin.symbol, g);
                    await api(`/api/tickers/${oldSym}`, { method: 'DELETE' });
                    setSelectedTicker(twin.symbol);
                    setPrices(await (await api('/api/prices')).json());
                    loadWatchlistState();
                } catch (err) {
                    alert('Network issue swapping the ticker.');
                }
            };

            const handleAddTicker = async (e) => {
                e.preventDefault();
                if (!isConnected) return;
                if (!newTicker.trim()) return;
                const symbol = newTicker.trim().toUpperCase();

                try {
                    const response = await api(`/api/tickers/${symbol}`, { method: 'POST' });
                    const result = await response.json();

                    if (result.status === 'success') {
                        const tw = result.base_currency_twin;
                        if (tw) {
                            alert(`${symbol} is priced in ${result.currency}.\n\n`
                                + `${tw.symbol} is the same fund (ISIN ${tw.isin || 'unknown'}) `
                                + `priced in ${tw.currency} on ${tw.exchange}.\n\n`
                                + `Use the "${tw.currency} line" link on its card to switch.`);
                        }
                        // Group it before the price refresh, so it never flashes up
                        // under "Other" on the way to where it belongs.
                        const group = (newTickerGroup === '__new__' ? newGroupName : newTickerGroup).trim();
                        if (group) {
                            await assignGroup(symbol, group);
                            setOpenThemes(p => ({ ...p, [group]: true }));
                        }
                        setNewTicker('');
                        setNewGroupName('');
                        setSelectedTicker(symbol); // Auto-select
                        // Refresh prices
                        const priceResponse = await api('/api/prices');
                        setPrices(await priceResponse.json());
                        loadWatchlistState();
                    } else {
                        alert(result.message || "Failed to add ticker");
                        console.error("Failed to add ticker:", result.message);
                    }
                } catch (error) {
                    console.error("Error adding ticker:", error);
                }
            };

            const handleDeleteTicker = async (e, symbol) => {
                e.stopPropagation();
                if (!isConnected) return;
                if (!confirm(`Are you sure you want to remove ${symbol}?`)) return;
                try {
                    const response = await api(`/api/tickers/${symbol}`, { method: 'DELETE' });
                    const result = await response.json();

                    if (result.status === 'success') {
                        const remaining = portfolioTickers.filter(t => t !== symbol);
                        if (selectedTicker === symbol) {
                            setSelectedTicker(remaining.length > 0 ? remaining[0] : '');
                        }
                        // Refresh prices
                        const priceResponse = await api('/api/prices');
                        setPrices(await priceResponse.json());
                        loadWatchlistState();
                    } else {
                        alert(result.message || "Failed to delete ticker");
                        console.error("Failed to delete ticker:", result.message);
                    }
                } catch (error) {
                    console.error("Error deleting ticker:", error);
                }
            };

            const handleConnect = async (e) => {
                e.preventDefault();
                setIsConnecting(true);
                setConnectionError('');
                try {
                    const response = await api('/api/connection/connect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ host, port: parseInt(port), client_id: parseInt(clientId) })
                    });
                    const data = await response.json();
                    if (data.status === 'success') {
                        setIsConnected(true);
                        setConnectionError('');
                        setShowSettings(false);
                        // Refresh prices
                        const priceResponse = await api('/api/prices');
                        setPrices(await priceResponse.json());
                    } else {
                        setConnectionError(data.message || 'Failed to connect');
                    }
                } catch (error) {
                    setConnectionError('Unable to contact server endpoint.');
                    console.error("Error connecting:", error);
                } finally {
                    setIsConnecting(false);
                }
            };

            const handleDisconnect = async () => {
                if (!confirm("Are you sure you want to disconnect from the IBKR Gateway?")) return;
                setIsConnecting(true);
                try {
                    const response = await api('/api/connection/disconnect', { method: 'POST' });
                    const data = await response.json();
                    if (data.status === 'success') {
                        setIsConnected(false);
                        setSelectedAccount('');
                        setPrices({});
                    }
                } catch (error) {
                    console.error("Error disconnecting:", error);
                } finally {
                    setIsConnecting(false);
                }
            };

            // Order Submission Handlers
            const handleOrderSubmit = (e) => {
                e.preventDefault();
                if (!isConnected) return;
                if (!orderSymbol.trim()) {
                    alert("Please specify a ticker symbol.");
                    return;
                }
                const qty = parseInt(orderQty);
                if (isNaN(qty) || qty <= 0) {
                    alert("Please enter a valid positive quantity.");
                    return;
                }
                const price = parseFloat(orderLimitPrice);
                if (isNaN(price) || price <= 0) {
                    alert("Please enter a valid limit price.");
                    return;
                }

                setConfirmError('');
                setShowConfirmModal(true);
            };

            const executeOrder = async () => {
                setIsSubmittingOrder(true);
                setConfirmError('');
                try {
                    const reqBody = {
                        symbol: orderSymbol.toUpperCase().trim(),
                        action: orderAction,
                        order_type: ORDER_TYPE,
                        quantity: parseInt(orderQty),
                        limit_price: parseFloat(orderLimitPrice),
                        account: selectedAccount || null
                    };

                    const response = await api('/api/orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(reqBody)
                    });
                    const result = await response.json();

                    if (result.status === 'success' || result.status === 'pending') {
                        // 'pending' means the order was SENT but IBKR hasn't ruled yet. Close the
                        // modal either way — leaving it open invites a resubmit and a duplicate
                        // order — and warn so the user goes and checks.
                        setShowConfirmModal(false);
                        setOrderQty('10');
                        setActiveTab('portfolio');

                        // Force update working orders/balances
                        const ordUrl = `/api/orders${selectedAccount ? `?account=${selectedAccount}` : ''}`;
                        const ordResp = await api(ordUrl);
                        setWorkingOrders(asArray(await ordResp.json()));

                        const accUrl = `/api/account${selectedAccount ? `?account=${selectedAccount}` : ''}`;
                        const accResp = await api(accUrl);
                        setAccountInfo(await accResp.json());

                        if (result.status === 'pending') {
                            alert(result.message || 'Order sent but not yet confirmed by IBKR.');
                        }
                    } else {
                        // Rejected: the order is dead, so keeping the modal open is safe and
                        // lets the user read IBKR's actual reason and correct the entry.
                        setConfirmError(result.message || 'Failed to execute trade.');
                    }
                } catch (error) {
                    setConfirmError('Network issue placing trade.');
                    console.error(error);
                } finally {
                    setIsSubmittingOrder(false);
                }
            };

            const handleCancelOrder = async (orderId) => {
                if (!confirm(`Submit cancellation request for order #${orderId}?`)) return;
                try {
                    const response = await api(`/api/orders/${orderId}`, { method: 'DELETE' });
                    const result = await response.json();

                    // Refresh on BOTH paths. On failure the order is still live at the
                    // broker, so the list must show it again rather than leave the user
                    // believing a working order is gone.
                    const ordUrl = `/api/orders${selectedAccount ? `?account=${selectedAccount}` : ''}`;
                    const ordResp = await api(ordUrl);
                    setWorkingOrders(asArray(await ordResp.json()));

                    if (result.status !== 'success') {
                        alert(result.message || 'Failed to cancel order.');
                    }
                } catch (error) {
                    console.error("Error cancelling order:", error);
                }
            };

            const handleFlexImport = async (e) => {
                e.preventDefault();
                setIsImporting(true);
                setImportStatus(null);
                try {
                    const response = await api('/api/orders/history/import', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token: flexToken.trim() || null,
                            query_id: flexQueryId.trim() || null,
                            path: flexPath.trim() || null,
                        }),
                    });
                    const result = await response.json();
                    setImportStatus(result);

                    if (result.status === 'success') {
                        // Clear the credential as soon as it has been used.
                        setFlexToken('');
                        await fetchHistory();
                    }
                } catch (error) {
                    setImportStatus({ status: 'error', message: 'Network issue during import.' });
                    console.error(error);
                } finally {
                    setIsImporting(false);
                }
            };

            // One combined figure in the base currency, with the native split behind
            // it. The server converts; anything it could not convert is named rather
            // than folded in, because a total missing a position is worse than none.
            const pnlTotal = (() => {
                if (!positions.length) return null;
                const base = positions[0].baseCurrency || 'USD';
                const native = {};
                let combined = 0, missing = [];
                positions.forEach(p => {
                    const c = p.currency || base;
                    native[c] = (native[c] || 0) + (Number(p.unrealizedPnL) || 0);
                    const b = p.unrealizedPnLBase;
                    if (b == null && c !== base) missing.push(p.symbol);
                    else combined += Number(b ?? p.unrealizedPnL) || 0;
                });
                return {
                    base, combined, missing,
                    native: Object.entries(native).map(([currency, total]) => ({ currency, total })),
                    multi: Object.keys(native).length > 1,
                };
            })();

            const riskWindowLabel = (RISK_WINDOWS.find(w => w.key === riskWindow) || {}).full || riskWindow;

            // Which statistics the selected window is too short to support. Derived from
            // what actually came back, not from a hardcoded table, so it stays honest if
            // the sample floors change.
            const suppressedByWindow = (() => {
                const rows = Object.values(riskBySymbol).filter(m => m && !m.error);
                if (!rows.length) return [];
                const missing = (test) => rows.every(test);
                const out = [];
                if (missing(m => m.beta_spy == null)) out.push('β vs SPY');
                if (missing(m => m.pillars?.efficiency?.sortino == null)) out.push('Sortino');
                if (missing(m => m.pillars?.efficiency?.information_ratio == null)) out.push('information ratio');
                if (missing(m => m.pillars?.tail_risk?.cvar95_pct == null)) out.push('CVaR95 / skew');
                if (missing(m => m.pillars?.momentum?.ma_state == null)) out.push('50/200 MA cross');
                return out;
            })();

            const rangeLabel = (HISTORY_RANGES.find(r => r.key === historyRange) || {}).label || 'All';

            // Currencies that actually produced a realized result, biggest first.
            const realizedByCurrency = asArray(historyTotals.byCurrency)
                .filter(c => c.realizedPnL != null)
                .sort((a, b) => Math.abs(b.realizedPnL) - Math.abs(a.realizedPnL));

            // True when the store was not recording for part of the selected window,
            // so an empty table means "no data", not "no trades".
            const historyStartsAfterWindow = (() => {
                const start = historyRangeStart(historyRange);
                if (!start || !historyCoverage.firstFill) return false;
                return new Date(historyCoverage.firstFill) > start;
            })();

            // Per-symbol freshness. The feed banner is global — one live symbol keeps it
            // green while another has been frozen for minutes — so each quote is aged
            // individually against the threshold the server reports for this session.
            const staleAfter = feedStatus?.stale_after_seconds ?? 30;
            // Sessions are per EXCHANGE: VUAG trades on the LSE and is shut while
            // NASDAQ is open, so one global flag mislabels whichever is the odd one out.
            // Falls back to the US feed state when a symbol's schedule is unknown.
            const usClosed = feedStatus?.state === 'market_closed';
            const isSymClosed = (d) => d && d.session
                ? !['open', 'extended'].includes(d.session)
                : usClosed;
            // A quote only goes stale when one was expected. With that symbol's market
            // shut the last price IS its close, and amber would claim a broken feed.
            const isStale = (d) => d && !isSymClosed(d) && d.age_seconds != null
                && d.age_seconds > staleAfter;
            const closeLabelFor = (d) => {
                const day = (d && d.last_close_day) || feedStatus?.last_close_day;
                return day
                    ? `at the ${new Date(day + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} close`
                    : 'at the last close';
            };
            const ageLabel = (sec) => sec == null ? 'no tick yet'
                : sec < 60 ? `${Math.round(sec)}s old`
                : `${Math.floor(sec / 60)}m ${Math.round(sec % 60)}s old`;

            const portfolioTickers = Object.keys(prices);

            // IBKR quotes every instrument in its own listing currency and reports balances
            // in the account's base currency — neither is guaranteed to be USD. A hardcoded
            // '$' therefore mislabels real numbers: VUAG (LSE) is GBP, and this account's
            // balances are GBP too. Unknown codes fall back to the ISO code itself.

            // Fill timestamps are stored as ISO UTC; show them in the viewer's zone.
            const fillTime = (iso) => {
                if (!iso) return '--';
                const d = new Date(iso);
                return isNaN(d) ? iso : d.toLocaleString(undefined, {
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
            };
            const signed = (v, digits = 2) => `${v >= 0 ? '+' : ''}${Number(v).toFixed(digits)}`;

            // Two decimals everywhere in the risk table: the ± on sigma is ~0.15, so a
            // third and fourth decimal were never meaningful.
            const fx = (v, digits = 2) => v == null ? '—' : Number(v).toFixed(digits);

            const shortMonth = (iso) => {
                const d = new Date(iso);
                return isNaN(d) ? iso : d.toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
            };

            // Whole quantities stay whole (5, not 5.00); fractional ones — FX, and
            // fractional shares — get two places. Keyed on the value rather than on
            // secType, because a Flex query without an Asset Class column imports
            // forex rows with no secType at all.
            const qty = (v) => {
                const n = Number(v);
                if (!isFinite(n)) return '--';
                if (Number.isInteger(n)) return String(n);
                // Never round a real quantity away to 0.00.
                return Math.abs(n) < 0.005 ? String(Number(n.toPrecision(2))) : n.toFixed(2);
            };

            // Currency of the symbol currently in the order form, for the confirm modal.
            const orderCurrency = prices[orderSymbol]?.currency || accountInfo.currency || 'USD';

            // One place mapping feed state -> how it looks and what a price cell says when
            // there is no number to show. `placeholder` is deliberately short: it sits in a
            // narrow column where the full explanation lives in the banner above.
            const FEED_PRESENTATION = {
                live:           { placeholder: '---',      dot: 'bg-green-500',  box: null },
                market_closed:  { placeholder: 'closed',   dot: 'bg-gray-500',   box: 'bg-gray-800/30 border-gray-700/60 text-gray-300' },
                no_entitlement: { placeholder: 'no sub',   dot: 'bg-amber-500',  box: 'bg-amber-950/20 border-amber-800/40 text-amber-200/90' },
                no_data:        { placeholder: 'no feed',  dot: 'bg-amber-500',  box: 'bg-amber-950/20 border-amber-800/40 text-amber-200/90' },
                stale:          { placeholder: 'stale',    dot: 'bg-amber-500',  box: 'bg-amber-950/20 border-amber-800/40 text-amber-200/90' },
                disconnected:   { placeholder: 'offline',  dot: 'bg-red-500',    box: 'bg-red-950/20 border-red-800/40 text-red-300/90' },
                backend_down:   { placeholder: 'offline',  dot: 'bg-red-500',    box: 'bg-red-950/20 border-red-800/40 text-red-300/90' },
            };
            const feedView = FEED_PRESENTATION[feedStatus?.state] || FEED_PRESENTATION.live;
            const feedIsLive = feedStatus?.state === 'live';

            // Risk buckets. The WORD carries the meaning and the colour reinforces it —
            // never colour alone. Buckets rather than a printed z because sigma itself
            // carries ~16% sampling error at a 20-day window, and returns are fat-tailed
            // enough (|z|>3 occurs ~6x more often than Gaussian) that a decimal z would
            // imply confidence the estimate cannot support.
            // Gate verdicts. Same rule as RISK_CHIP: the WORD carries the meaning and
            // the colour only reinforces it, so the table stays readable to anyone who
            // cannot separate red from green.
            const GATE_VIEW = {
                'true':  { label: 'pass', cls: 'text-green-400 border-green-700/60' },
                'false': { label: 'fail', cls: 'text-red-400 border-red-700/60' },
                'null':  { label: 'n/a',  cls: 'text-gray-600 border-gray-700/60' },
            };

            // One column per pillar. `value` is the single number that decided the gate —
            // shown under the verdict so a fail is never a bare assertion.
            // How each gate is computed, for the header hover. Kept beside PILLARS so
            // the two cannot drift apart.
            const PILLAR_HELP = {
                momentum: {
                    what: 'Is the name out-growing its sector benchmark?',
                    formula: 'drift = mean(daily return) × 252\nexcess = drift(stock) − drift(benchmark)',
                    gate: 'passes when excess > 0',
                    note: 'Both legs are measured only on days BOTH traded, so a listing gap cannot flatter either side. The benchmark is the sector ETF named in the "vs" column.',
                },
                efficiency: {
                    what: 'Is the return worth the risk taken to get it?',
                    formula: 'Sortino = (mean(r) × 252) ÷ (downside deviation × √252)\n  downside deviation = √mean(min(r,0)²)\nInfo ratio = (mean(r − benchmark) × 252) ÷ (tracking error × √252)',
                    gate: 'passes when Sortino > 1.0 AND info ratio > 0',
                    note: 'Sortino divides by the FULL-length denominator, not just losing days — dividing by only the down days inflates the ratio for anything that rarely falls.',
                },
                tail_risk: {
                    what: 'How ugly are the bad days?',
                    formula: 'skew = bias-corrected sample skewness (Fisher-Pearson G1)\nCVaR95 = mean of the worst 5% of daily returns',
                    gate: 'passes when skew ≥ −0.25 AND CVaR95 ≤ 10%',
                    note: 'CVaR is historical, not Gaussian: a normal-distribution estimate would understate exactly the fat left tail this gate exists to catch. Both need 30+ sessions or they read "--".',
                },
                sentiment: {
                    what: 'Is the option market pricing more risk than the stock has shown?',
                    formula: 'IV = mean of IBKR implied vol, last 60 sessions\nHV = stdev(last 60 returns) × √252\nVRP = IV − HV, in annualised vol points',
                    gate: 'passes when VRP is between −15 and +15',
                    note: 'The only forward-looking pillar. A large positive VRP means options are expensive against what the stock actually did; negative means the opposite. Blank when no implied-vol history is stored.',
                },
            };

            const PILLARS = [
                { key: 'momentum',   label: 'Momentum',
                  value: p => p.excess_drift_pct == null ? '--'
                    : `${p.excess_drift_pct > 0 ? '+' : ''}${p.excess_drift_pct.toFixed(1)}% vs bm` },
                { key: 'efficiency', label: 'Efficiency',
                  value: p => p.sortino == null ? '--' : `Sortino ${p.sortino.toFixed(2)}` },
                { key: 'tail_risk',  label: 'Tail risk',
                  value: p => p.cvar95_pct == null ? '--' : `CVaR ${p.cvar95_pct.toFixed(1)}%` },
                { key: 'sentiment',  label: 'Sentiment',
                  value: p => p.vrp_points == null ? '--'
                    : `VRP ${p.vrp_points > 0 ? '+' : ''}${p.vrp_points.toFixed(1)}` },
            ];

            const RISK_CHIP = {
                normal:  { label: 'normal',  cls: 'text-gray-500 border-gray-700' },
                notable: { label: 'notable', cls: 'text-amber-400 border-amber-700/60' },
                unusual: { label: 'unusual', cls: 'text-orange-400 border-orange-700/60' },
                extreme: { label: 'extreme', cls: 'text-red-400 border-red-700/60' },
            };

            // Sequential blue, stepped for a dark surface: low correlation recedes toward
            // the background, high advances. One hue because correlation shown here is a
            // magnitude, not a polarity — a two-colour scale would invent a midpoint.
            const CORR_STEPS = ['#104281', '#1c5cab', '#2a78d6', '#5598e7', '#9ec5f4'];
            const corrColor = v => CORR_STEPS[Math.min(4, Math.max(0, Math.floor(v * 5)))];

            // Sigma as a bar length, comparable across rows in a way "10.1%" beside
            // "4.6%" is not. 12%/day is the top of the scale — beyond that it pins.
            const sigmaPct = s => Math.max(2, Math.min(100, (s / 12) * 100));

            // Drawdown is a magnitude with no positive end, so one hue rather than a
            // diverging scale that would invent a midpoint.
            const DD_HUE = '#b4522a';

            const posCtxRows = asArray(posContext?.rows).filter(r => r && !r.error && r.drawdown);

            // Grouping reads the editable config directly, so a rename or a new group
            // shows immediately rather than waiting on the next analytics poll.
            const watchlistGroups = (() => {
                if (!portfolioTickers.length) return [];
                if (!themeCfg.groups.length) return [['', portfolioTickers]];
                const out = [];
                themeCfg.groups.forEach(g => {
                    const members = portfolioTickers.filter(t => themeCfg.assign[t] === g);
                    if (members.length) out.push([g, members]);
                });
                const leftover = portfolioTickers.filter(t => !themeCfg.assign[t]);
                if (leftover.length) out.push(['Other', leftover]);
                return out;
            })();

            const book = posContext?.book || null;
            const holdings = posContext?.holdings || null;
            // Bars are scaled to the deepest drawdown on screen, so the worst name
            // fills the bar and the rest read against it.
            const posCtxScale = Math.max(
                5, ...posCtxRows.map(r => Math.abs(r.drawdown?.current_pct || 0)));


            // Calculate estimated capital cost for order verification
            // Priced off the limit you typed, never off a possibly-stale quote.
            const estPrice = parseFloat(orderLimitPrice || 0);
            const estTotalCost = parseInt(orderQty || 0) * estPrice;

            if (!hasToken) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <form onSubmit={saveToken}
                              className="bg-gray-800/40 backdrop-blur-md border border-gray-700/80 rounded-2xl p-6 shadow-lg w-full max-w-md space-y-4">
                            <div>
                                <h1 className="text-xl font-bold text-white">Dashboard locked</h1>
                                <p className="text-sm text-gray-400 mt-1 leading-relaxed">
                                    This API can place live orders, so every request needs a token.
                                    Set <code className="text-gray-300">DASHBOARD_TOKEN</code> in <code className="text-gray-300">.env</code>,
                                    or copy the one <code className="text-gray-300">server.py</code> printed to the terminal at startup.
                                </p>
                            </div>
                            <input
                                type="password"
                                value={tokenInput}
                                onChange={e => setTokenInput(e.target.value)}
                                placeholder="Paste dashboard token"
                                autoFocus
                                className="w-full bg-gray-900/50 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-blue-500"
                            />
                            {authError && (
                                <div className="text-red-400 text-xs bg-red-950/30 border border-red-900/50 p-2.5 rounded-lg leading-relaxed">
                                    {authError}
                                </div>
                            )}
                            <button type="submit"
                                    className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-2 rounded-lg font-medium text-sm">
                                Unlock
                            </button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="max-w-7xl mx-auto p-6">
                    {/* HEADER ACCOUNT BAR */}
                    <header className="mb-6 border-b border-gray-800 pb-4">
                        <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-4">
                            <div>
                                <h1 className="text-3xl font-bold text-white tracking-tight flex items-center gap-2">
                                    <span className="bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent">Macro Trading Dashboard</span>
                                </h1>
                                <p className="text-gray-400 text-sm mt-1">Live IBKR Execution Engine</p>
                            </div>
                            
                            {/* Live vs Paper account badge */}
                            <div className="flex items-center gap-3">
                                {isConnected && (
                                    <div className={`px-4 py-2 rounded-xl text-sm font-bold border flex items-center gap-2 ${
                                        accountInfo.is_live

                                        {accountInfo.is_live ? '🔴 LIVE ACCOUNT ACTIVE' : '🟢 DEMO/PAPER ACCOUNT'}

                                <div className="flex items-center gap-3 bg-gray-800/80 px-4 py-2 rounded-xl border border-gray-700">
                                    <span className="text-xs text-gray-400 font-medium">Gateway:</span>

                                        <span className={`w-2.5 h-2.5 rounded-full ${isConnected ? 'bg-green-500 animate-pulse' : 'bg-red-500'}`}></span>

                                            {isConnected ? 'Connected' : 'Disconnected'}

                                </div>
                            </div>
                        </div>

                        {/* Account Balance Strip */}
                        {isConnected && (
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 bg-gray-800/20 backdrop-blur-md border border-gray-700/80 p-4 rounded-2xl shadow-inner mt-2">
                                <div>
                                    <span className="text-xs text-gray-400 font-semibold block mb-0.5">Account Code</span>
                                    {accountInfo.accounts && accountInfo.accounts.length > 1 ? (
                                        <select 
                                            value={selectedAccount}
                                            onChange={e => setSelectedAccount(e.target.value)}
                                            className="bg-gray-900 border border-gray-700 text-white font-mono rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500 font-bold"
                                        >
                                            {accountInfo.accounts.map(acc => (
                                                <option key={acc} value={acc}>{acc}</option>
                                            ))}
                                        </select>
                                    ) : (
                                        <span className="text-md font-bold text-white font-mono">{accountInfo.account_code}</span>
                                    )}
                                </div>
                                <div>
                                    <span className="text-xs text-gray-400 font-semibold block mb-0.5">Net Liquidation</span>
                                    <span className="text-md font-bold text-white font-mono">{moneyLocale(accountInfo.net_liquidation, accountInfo.currency)}</span>
                                </div>
                                <div>
                                    <span className="text-xs text-gray-400 font-semibold block mb-0.5">Cash Balance</span>
                                    <span className="text-md font-bold text-white font-mono">{moneyLocale(accountInfo.cash_balance, accountInfo.currency)}</span>
                                </div>
                                <div>
                                    <span className="text-xs text-gray-400 font-semibold block mb-0.5">Buying Power</span>
                                    <span className="text-md font-bold text-white font-mono">{moneyLocale(accountInfo.buying_power, accountInfo.currency)}</span>
                                </div>
                            </div>
                        )}
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* LEFT COLUMN: SETTINGS & WATCHLIST & ORDER ENTRY */}
                        <div className="lg:col-span-1 space-y-6">
                            
                            {/* IBKR Connection settings card */}
                            <div className="bg-gray-800/40 backdrop-blur-md border border-gray-700/80 rounded-2xl p-5 shadow-lg">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-md font-bold text-gray-200 uppercase tracking-wider flex items-center gap-2">
                                        <svg className="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                        </svg>
                                        IBKR Connection
                                    </h3>
                                    <button 
                                        onClick={() => setShowSettings(!showSettings)}
                                        className="text-xs text-blue-400 hover:text-blue-300 font-semibold focus:outline-none"
                                    >
                                        {showSettings ? 'Hide Config' : 'Show Config'}
                                    </button>
                                </div>

                                {(!isConnected || showSettings) ? (
                                    <form onSubmit={handleConnect} className="space-y-4">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="col-span-2">
                                                <label className="text-xs text-gray-400 font-semibold mb-1 block">Gateway Host</label>
                                                <input 
                                                    type="text" 
                                                    value={host}
                                                    onChange={e => setHost(e.target.value)}
                                                    className="w-full bg-gray-900/50 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" 
                                                    placeholder="127.0.0.1"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-400 font-semibold mb-1 block">Socket Port</label>
                                                <input 
                                                    type="number" 
                                                    value={port}
                                                    onChange={e => setPort(e.target.value)}
                                                    className="w-full bg-gray-900/50 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" 
                                                    placeholder="4002"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-400 font-semibold mb-1 block">Client ID</label>
                                                <input 
                                                    type="number" 
                                                    value={clientId}
                                                    onChange={e => setClientId(e.target.value)}
                                                    className="w-full bg-gray-900/50 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" 
                                                    placeholder="1"
                                                    required
                                                />
                                            </div>
                                        </div>

                                        {connectionError && (
                                            <div className="text-red-400 text-xs bg-red-950/30 border border-red-900/50 p-2.5 rounded-lg">
                                                {connectionError}
                                            </div>
                                        )}

                                        <button 
                                            type="submit" 
                                            disabled={isConnecting}
                                            className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-2 rounded-lg font-medium transition-all shadow-md shadow-blue-500/10 text-sm flex items-center justify-center gap-2"
                                        >
                                            {isConnecting ? (
                                                <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                                            ) : null}
                                            {isConnecting ? 'Connecting...' : 'Connect to Gateway'}
                                        </button>
                                    </form>
                                ) : (
                                    <div className="space-y-3">
                                        <div className="text-xs text-gray-400 space-y-1 bg-gray-900/40 p-3 rounded-lg border border-gray-800">
                                            <div><span className="font-semibold text-gray-300">Host:</span> {host}</div>
                                            <div><span className="font-semibold text-gray-300">Port:</span> {port}</div>
                                            <div><span className="font-semibold text-gray-300">Client ID:</span> {clientId}</div>
                                        </div>
                                        <button 
                                            onClick={handleDisconnect}
                                            disabled={isConnecting}
                                            className="w-full bg-red-950/30 hover:bg-red-900/40 border border-red-900/50 text-red-400 py-2 rounded-lg font-medium transition-colors text-sm"
                                        >
                                            Disconnect Session
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Watchlist Section */}
                            <div className="space-y-4">
                                <h2 className="text-xl font-semibold text-gray-200 flex items-center justify-between">
                                    <span className="flex items-center">
                                        <span className={`w-2.5 h-2.5 rounded-full mr-2 ${feedView.dot} ${feedIsLive ? 'animate-pulse' : ''}`}></span>
                                        Live Watchlist
                                    </span>
                                    {feedStatus && (
                                        <span className="text-xs font-normal text-gray-400 font-mono">
                                            {feedStatus.headline}
                                        </span>
                                    )}
                                </h2>

                                {/* Two different questions, so two lines: what you are exposed
                                    to, and what you are choosing from. Conflating them under one
                                    "BOOK" label read as holdings when it never was. */}
                                {(holdings || book) && (
                                    <div className="bg-gray-900/40 border border-gray-800 rounded-lg px-3 py-2 mb-1 space-y-2">
                                        {[
                                            holdings && holdings.symbols > 0 && {
                                                key: 'h', label: 'Holdings', sub: `${holdings.symbols} position${holdings.symbols === 1 ? '' : 's'} · by market value`,
                                                d: holdings, accent: 'text-indigo-300',
                                            },
                                            book && {
                                                key: 'w', label: 'Watchlist', sub: `${book.symbols} names · equal weight`,
                                                d: book, accent: 'text-gray-400',
                                            },
                                        ].filter(Boolean).map(row => (
                                            <div key={row.key}>
                                                <div className="flex flex-wrap items-baseline gap-x-4 gap-y-1 font-mono text-xs">
                                                    <span className={`text-[10px] uppercase tracking-wider font-sans font-semibold ${row.accent}`}>
                                                        {row.label}
                                                    </span>
                                                    <span className="text-gray-500">β
                                                        <span className={`ml-1 font-bold ${row.d.beta >= 2 ? 'text-amber-400' : 'text-gray-200'}`}>
                                                            {row.d.beta == null ? '—' : row.d.beta.toFixed(2)}
                                                        </span>
                                                    </span>
                                                    <span className="text-gray-500">down-cap
                                                        <span className={`ml-1 font-bold ${row.d.down_capture_pct >= 200 ? 'text-amber-400' : 'text-gray-200'}`}>
                                                            {row.d.down_capture_pct == null ? '—' : `${row.d.down_capture_pct.toFixed(0)}%`}
                                                        </span>
                                                    </span>
                                                    <span className="text-gray-500">asym
                                                        <span className={`ml-1 font-bold ${row.d.asymmetry_pct >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                            {row.d.asymmetry_pct == null ? '—'
                                                                : `${row.d.asymmetry_pct > 0 ? '+' : ''}${row.d.asymmetry_pct.toFixed(0)}%`}
                                                        </span>
                                                    </span>
                                                    {row.d.effective_bets != null && row.d.symbols > 1 && (
                                                        <span className="text-gray-500" title="Participation ratio of the correlation matrix: how many genuinely independent positions these names amount to.">
                                                            ~<span className="text-gray-200 font-bold">{row.d.effective_bets.toFixed(1)}</span> independent
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="text-[10px] text-gray-600 mt-0.5">
                                                    {row.sub}
                                                    {row.d.weights && (
                                                        <span className="ml-1">
                                                            ({Object.entries(row.d.weights).map(([k, v]) => `${k} ${v}%`).join(' · ')})
                                                        </span>
                                                    )}
                                                    {/* A position left out of its own book has to say so. */}
                                                    {asArray(row.d.excluded).length > 0 && (
                                                        <span className="text-amber-400/70 ml-1">
                                                            · excludes {row.d.excluded.map(e => `${e.symbol} (${e.reason})`).join(', ')}
                                                        </span>
                                                    )}
                                                    {asArray(row.d.estimated_weights).length > 0 && (
                                                        <span className="text-amber-400/70 ml-1">
                                                            · {row.d.estimated_weights.join(', ')} weighted at cost, no live quote
                                                        </span>
                                                    )}
                                                    {/* Name the rate that produced the weights: a converted
                                                        percentage is only as good as the rate behind it. */}
                                                    {row.d.fx_used && Object.keys(row.d.fx_used).length > 0 && (
                                                        <span className="text-gray-500 ml-1">
                                                            · converted to {row.d.base_currency} at{' '}
                                                            {Object.entries(row.d.fx_used)
                                                                .map(([c, r]) => `${c} ${r.rate}`).join(', ')}
                                                            <span className="text-gray-600"> ({Object.values(row.d.fx_used)[0].source})</span>
                                                        </span>
                                                    )}
                                                    {asArray(row.d.unconverted).length > 0 && (
                                                        <span className="text-amber-400 ml-1">
                                                            · ⚠ no FX rate for {row.d.unconverted.join(', ')} — its weight is not comparable
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                        <div className="text-[10px] text-gray-600 pt-1 border-t border-gray-800/60">
                                            over {posContext?.window_label} · vs {posContext?.benchmark}
                                        </div>
                                    </div>
                                )}

                                {/* Replaces the old "connect your gateway" notice: that assumed the only
                                    reason for blank prices was a missing connection. It also covers a shut
                                    market, a missing data subscription and a stalled feed — each of which
                                    previously rendered as indistinguishable dashes. */}
                                {feedStatus && !feedIsLive && feedView.box && (
                                    <div className={`p-4 border rounded-xl text-sm leading-relaxed ${feedView.box}`}>
                                        <strong>{feedStatus.headline}</strong>
                                        <div className="mt-1 opacity-90">{feedStatus.detail}</div>
                                        {feedStatus.state === 'disconnected' && (
                                            <div className="mt-2 opacity-75">
                                                Use the connection panel above to reconnect.
                                            </div>
                                        )}
                                        {feedStatus.farms && Object.keys(feedStatus.farms).length > 0 && (
                                            <div className="mt-2 text-xs opacity-70 font-mono">
                                                {Object.entries(feedStatus.farms)
                                                    .map(([name, st]) => `${name}: ${st}`).join('  ·  ')}
                                            </div>
                                        )}
                                    </div>
                                )}

                                <div className="space-y-3">
                                    {portfolioTickers.length === 0 ? (
                                        <div className="text-gray-500 italic text-center py-6 border border-gray-800 rounded-xl bg-gray-800/10">
                                            {isConnected ? 'No tickers tracked yet. Add one below!' : 'Connect to view default tickers.'}
                                        </div>
                                    ) : (
                                        watchlistGroups.map(([theme, syms]) => {
                                        // No theme = the server has not supplied the mapping yet, so
                                        // there is nothing to collapse into.
                                        const open = !theme || !!openThemes[theme];
                                        const held = syms.filter(t => positions.some(p => p.symbol === t));
                                        return (
                                        <div key={theme || 'all'} className="space-y-3">
                                            {theme && (renaming === theme ? (
                                                <div className="flex items-center gap-2 px-3 py-2 rounded-xl border border-blue-500 bg-gray-800/50">
                                                    <input
                                                        autoFocus
                                                        value={renameText}
                                                        onChange={e => setRenameText(e.target.value)}
                                                        onKeyDown={e => {
                                                            if (e.key === 'Enter') renameGroup(theme, renameText);
                                                            if (e.key === 'Escape') setRenaming(null);
                                                        }}
                                                        className="flex-1 bg-transparent text-xs font-semibold uppercase tracking-wider text-white focus:outline-none"
                                                    />
                                                    <button onClick={() => renameGroup(theme, renameText)}
                                                            className="text-[10px] text-blue-400 hover:text-blue-300 font-semibold">save</button>
                                                    <button onClick={() => setRenaming(null)}
                                                            className="text-[10px] text-gray-500 hover:text-gray-300">cancel</button>
                                                </div>
                                            ) : (
                                                <div
                                                    onClick={() => toggleTheme(theme)}
                                                    role="button"
                                                    aria-expanded={open}
                                                    className={`group/hdr w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl border transition-colors cursor-pointer ${
                                                        open ? 'bg-gray-800/50 border-gray-700' : 'bg-gray-800/25 border-gray-800 hover:bg-gray-800/40'
                                                    }`}
                                                >
                                                    <span className="flex items-center gap-2 min-w-0">
                                                        <span className={`text-gray-500 text-[10px] transition-transform ${open ? 'rotate-90' : ''}`}>▶</span>
                                                        <span className="text-xs font-semibold uppercase tracking-wider text-gray-300 truncate">
                                                            {theme}
                                                        </span>
                                                        {/* Appears on hover so the header stays clean while scanning. */}
                                                        <button
                                                            onClick={(e) => { e.stopPropagation(); setRenameText(theme); setRenaming(theme); }}
                                                            title={`Rename ${theme}`}
                                                            className="opacity-0 group-hover/hdr:opacity-100 text-gray-500 hover:text-white text-[11px] transition-opacity"
                                                        >✎</button>
                                                    </span>
                                                    <span className="flex items-center gap-2 shrink-0 font-mono text-[10px]">
                                                        {/* A sector you actually own is worth spotting while collapsed. */}
                                                        {held.length > 0 && (
                                                            <span className="text-indigo-400" title={`Holding ${held.join(', ')}`}>
                                                                {held.length} held
                                                            </span>
                                                        )}
                                                        <span className="text-gray-500">{syms.length}</span>
                                                    </span>
                                                </div>
                                            ))}
                                        {open && syms.map(ticker => {
                                            const data = prices[ticker] || { price: 0, bid: 0, ask: 0 };
                                            const isSelected = selectedTicker === ticker;
                                            const risk = riskBySymbol[ticker];
                                            const chip = risk && !risk.error
                                                ? RISK_CHIP[risk.last_z_bucket] : null;

                                            return (
                                                <div
                                                    key={ticker}
                                                    onClick={() => isConnected && setSelectedTicker(ticker)}
                                                    draggable
                                                    onDragStart={(e) => {
                                                        e.dataTransfer.setData('text/plain', ticker);
                                                        e.dataTransfer.effectAllowed = 'copy';
                                                    }}
                                                    title={`Click to chart ${ticker} · drag onto the correlation panel to compare it`}
                                                    className={`group p-4 rounded-xl transition-all duration-200 border ${
                                                        !isConnected ? 'opacity-65 cursor-not-allowed border-gray-800 bg-gray-900/20' :
                                                        isSelected ? 'bg-gray-800 border-blue-500 shadow-lg shadow-blue-500/15 cursor-pointer' : 
                                                        'bg-gray-800/40 border-gray-700/80 hover:bg-gray-700/60 cursor-pointer'
                                                    }`}
                                                >
                                                    <div className="flex justify-between items-center mb-2">
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-xl font-bold text-white">{ticker}</span>
                                                            {isConnected && (
                                                                <button
                                                                    onClick={(e) => handleDeleteTicker(e, ticker)}
                                                                    className="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-400 p-1 rounded hover:bg-gray-700/50 transition-all duration-200"
                                                                    title={`Remove ${ticker}`}
                                                                >
                                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                                                    </svg>
                                                                </button>
                                                            )}
                                                        </div>
                                                        {/* Name the reason instead of showing dashes, so a shut
                                                            market never looks like a broken backend. */}
                                                        <span
                                                            className={`font-semibold font-mono ${
                                                                isConnected && data.price > 0
                                                                    ? (isStale(data) ? 'text-2xl text-amber-400' : 'text-2xl text-white')
                                                                    : 'text-base text-gray-500'
                                                            }`}
                                                            title={isConnected && data.price > 0
                                                                ? `Last tick ${ageLabel(data.age_seconds)}`
                                                                : undefined}
                                                        >
                                                            {isConnected && data.price > 0
                                                                ? money(data.price, data.currency)
                                                                : feedView.placeholder}
                                                        </span>
                                                    </div>
                                                    <div className="flex justify-between text-sm text-gray-400 font-mono">
                                                        <span>Bid: {isConnected && data.bid > 0 ? data.bid.toFixed(2) : '--'}</span>
                                                        <span>Ask: {isConnected && data.ask > 0 ? data.ask.toFixed(2) : '--'}</span>
                                                    </div>
                                                    {/* Denominated in something other than the account currency —
                                                        common for LSE-listed commodity funds, which trade in London
                                                        but settle in dollars. */}
                                                    {isConnected && data.price_base != null && (
                                                        <div className="text-[11px] font-mono text-gray-500 mt-0.5"
                                                             title={`${data.currency}-denominated on ${data.exchange || 'its exchange'} — converted at the ${data.currency}/${data.base_currency} rate`}>
                                                            ≈ {money(data.price_base, data.base_currency)}
                                                            <span className="text-gray-600"> · priced in {data.currency}</span>
                                                        </div>
                                                    )}
                                                    {/* Same ISIN, same fund, your currency, different ticker. LSE
                                                        splits currency lines across tickers, so this is invisible
                                                        unless something goes looking for it. */}
                                                    {isConnected && data.base_twin && (
                                                        <button
                                                            onClick={(e) => { e.stopPropagation(); swapToTwin(ticker, data.base_twin); }}
                                                            title={`${data.base_twin.symbol} is the same fund (ISIN ${data.base_twin.isin || '—'}) priced in ${data.base_twin.currency}. Click to swap it in.`}
                                                            className="mt-1 text-[11px] font-mono text-blue-400 hover:text-blue-300 underline decoration-dotted"
                                                        >
                                                            {data.base_twin.currency} line: {data.base_twin.symbol} — switch
                                                        </button>
                                                    )}
                                                    {isConnected && isStale(data) && (
                                                        <div className="mt-1 text-[11px] font-mono text-amber-400/90">
                                                            stale — last tick {ageLabel(data.age_seconds)}
                                                        </div>
                                                    )}
                                                    {isConnected && isSymClosed(data) && data.price > 0 && (
                                                        <div className="mt-1 text-[11px] font-mono font-semibold text-pink-400"
                                                             title={data.exchange ? `${data.exchange} is closed — this is its last close, not a live quote` : undefined}>
                                                            {closeLabelFor(data)}
                                                            {/* Name the exchange when it is not the US one, so a London
                                                                listing showing closed beside open US names reads as
                                                                correct rather than as a bug. */}
                                                            {data.exchange && !['NASDAQ', 'NYSE', 'ARCA', 'BATS', 'SMART'].includes(data.exchange) && (
                                                                <span className="text-pink-400/60"> · {data.exchange}</span>
                                                            )}
                                                        </div>
                                                    )}

                                                    {/* Risk context. Sigma as a BAR because a length is comparable
                                                        across rows in a way "10.1%" beside "4.6%" is not. The chip
                                                        answers the only question a scanned list needs to answer:
                                                        does this one want my attention today? */}
                                                    {risk && !risk.error && (
                                                        <div className="mt-2.5 pt-2.5 border-t border-gray-700/50 space-y-1.5">
                                                            <div
                                                                className="h-1 rounded-full bg-gray-700/60 overflow-hidden"
                                                                title={`Daily volatility ${risk.sigma_daily_pct}% (±${risk.sigma_stderr_pct}) over ${risk.window_label || 'the selected window'} — ${risk.vol_window} sessions`}
                                                            >
                                                                <div

                                                    </p>
                                                </div>

                                        })()}
                                    </React.Fragment>)}

                                        <span className="text-white font-mono">{orderQty} shares</span>

                                    {(

                                    </div>
                                </div>

                                {isSymClosed(prices[orderSymbol]) && (
                                    <div className="bg-gray-800/40 border border-gray-700 p-3 rounded-lg text-xs text-gray-300 flex items-start gap-2">
                                        <span className="text-sm">🕒</span>
                                        <span>
                                            <strong>
                                                {prices[orderSymbol]?.exchange || 'Market'} closed:
                                            </strong>{' '}
                                            the price for {orderSymbol} is {closeLabelFor(prices[orderSymbol])},
                                            not a live quote. The order will rest until the next session, and the
                                            estimate above is based on that close.
                                        </span>
                                    </div>
                                )}

                                {isStale(prices[orderSymbol]) && (
                                    <div className="bg-amber-950/20 border border-amber-800/50 p-3 rounded-lg text-xs text-amber-300 flex items-start gap-2">
                                        <span className="text-sm">⚠️</span>
                                        <span>
                                            <strong>Stale quote:</strong> the last tick for {orderSymbol} was{' '}
                                            {ageLabel(prices[orderSymbol]?.age_seconds)}. The estimate above — and the
                                            seeded limit price — are based on that number, not the current market.
                                        </span>
                                    </div>
                                )}

                                {accountInfo.is_live && (
                                    <div className="bg-red-950/20 border border-red-900/50 p-3 rounded-lg text-xs text-red-400 flex items-start gap-2">
                                        <span className="text-sm">⚠️</span>
                                        <span><strong>Warning:</strong> You are submitting this trade on a Live Account. Capital will be executed.</span>
                                    </div>
                                )}

                                {confirmError && (
                                    <div className="text-red-400 text-xs bg-red-950/30 border border-red-900/50 p-3 rounded-lg">
                                        {confirmError}
                                    </div>
                                )}

                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setShowConfirmModal(false)}
                                        disabled={isSubmittingOrder}
                                        className="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-lg text-sm font-semibold transition-colors disabled:opacity-50"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={executeOrder}
                                        disabled={isSubmittingOrder}
                                        className={`flex-1 py-2.5 rounded-lg text-sm font-bold text-white transition-all flex items-center justify-center gap-2 ${
                                            accountInfo.is_live 
                                            ? 'bg-red-600 hover:bg-red-500 shadow-md shadow-red-500/10' 
                                            : 'bg-blue-600 hover:bg-blue-500 shadow-md shadow-blue-500/10'
                                        }`}
                                    >
                                        {isSubmittingOrder ? (
                                            <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                                        ) : null}
                                        {isSubmittingOrder ? 'Submitting...' : 'Confirm Trade'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>

</html>
